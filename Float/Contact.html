<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact page of Float" />
  <link rel="stylesheet" href="Contact.css">
  <title>Float — Contact</title>
</head>
<body>
  <header>
    <h1>Float</h1>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="Home.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="contact-header">
      <h2>Contact Us</h2>
      <p>Reach out for questions or service requests.</p>
      <div class="contact-info">
        <p>Email: <a href="mailto:you@example.com">you@example.com</a></p>
        <p>Phone: <a href="tel:+639123456789">+63 912 345 6789</a></p>
      </div>
    </div>

    <section aria-label="Contact form" class="form-container">
      <h3>Send a Message</h3>
      <form action="#">
        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required />
        </div>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="john@example.com" required />
        </div>
        <div class="input-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="How can we help you?" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> Your Website. All rights reserved. THIS WEBSITE IS A JOKE</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
